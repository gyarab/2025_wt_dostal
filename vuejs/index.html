<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VueJS DEMO</title>
    <link rel="icon" href="./favicon.ico">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>

<body>
    <div class="container pt-4" style="max-width: 624px; padding-bottom: 400px;">
        <h1 class="my-3 text-center">Registrace na meziplanetární výlet</h1>
        <div id="app">
            <div class="card p-3 mb-4">
                <form>
                    <div class="mb-3">
                        <label class="mb-1" for="name">Jméno astronauta</label>
                        <input class="form-control" type="text" id="name" name="name">
                    </div>
                    <div class="mb-3">
                        <label class="mb-1" for="planet">Destinace</label>
                        <select class="form-select" id="planet" name="planet">
                            <option value="Mars">Mars</option>
                            <option value="Venuše">Venuše</option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label class="mb-1" for="days">Počet dní</label>
                        <input class="form-control" type="number" id="days" name="days">
                    </div>
                    <div class="mb-3">
                        <input class="mb-1 me-1" class="form-check-input" type="checkbox" id="terms">
                        <label class="form-check-label" for="terms">Souhlasím s podmínkami</label>
                    </div>
                    <div class="pb-3">
                        <button class="btn btn-primary w-100" type="submit">Odeslat přihlášku</button>
                    </div>
                    <p class="text-muted">
                        Tento formulář nikam neposílá — vše se děje v prohlížeči.
                    </p>
                </form>
            </div>
            <div class="card p-3">
                <h2>Palubní lístek</h2>
                <p>
                    Jméno: <strong>Tester</strong> <br>
                    Destinace: <strong>Mars</strong> <br>
                    Počet dní: <strong>3</strong> <br>
                    Odhadovaná cena: <strong>2400 kreditů</strong> <br>
                </p>
                <p class="text-muted">
                    Pokud si to rozmyslíš, můžeš formulář upravt a palubní lístek se automaticky aktualizuje.
                </p>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js">
    </script>

    <script>
        const app = Vue.createApp({
            data() {
                return {
                    message: "Hello World!",
                    counter: 0
                }
            }
        })

        app.mount('#app')
    </script>
</body>

</html>
